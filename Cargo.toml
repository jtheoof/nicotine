[package]
name = "nicotine"
version = "0.6.0"
edition = "2021"
description = "High-performance EVE Online multiboxing tool (Linux X11/Wayland and Windows)"
license = "MIT"
repository = "https://github.com/isomerc/nicotine"

# Binary name is capitalized so Windows users see `Nicotine.exe` in
# Explorer (standard convention for user-facing apps like Discord.exe,
# Chrome.exe). On Linux `install-local.sh` drops a lowercase `nicotine`
# symlink next to it so shell commands stay lowercase.
[[bin]]
name = "Nicotine"
path = "src/main.rs"

# Test-only helper used by the Windows fake-EVE harness. Builds on
# every cargo build but isn't bundled in releases — release.yml
# copies the `Nicotine` binary specifically. On non-Windows it's a
# no-op stub that just exits, so cross-compile and Linux CI don't
# break from its presence.
[[bin]]
name = "fake-eve-stub"
path = "tests/bin/fake_eve_stub.rs"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.3"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
dirs = "5.0"
interprocess = "2.2"
fd-lock = "4.0"
# iced 0.14 powers the config panel (replaces egui/eframe). Default
# features pull in the wgpu (GPU) + tiny-skia renderers. On KWin Plasma
# Wayland the panel runs as a NATIVE WAYLAND window and renders on the
# GPU; it must never force the winit X11 backend, which panics
# ("Invalid surface") under XWayland. Same toolkit on Linux and Windows.
# `smol` enables iced::time::every (the debounce timer subscription),
# which isn't in iced's default features. `image` enables the window-icon
# decoder (iced::window::icon::from_file_data).
iced = { version = "0.14", features = ["image", "smol"] }
uuid = { version = "1", features = ["v4"] }
# Direct dep so preview_x11 can rasterize the character-name title text
# into an A8 alpha bitmap on Linux. Glyph raster lives in client memory;
# only the resulting pixmap goes to the X server, so this is a one-shot
# cost at preview creation, not per-frame.
ab_glyph = "0.2"
# Shared HTTP client used by both the version-check (Linux only) and the
# launch telemetry ping (cross-platform). rustls-tls keeps it pure-ish
# Rust so cargo-xwin cross-builds work without a system OpenSSL/SChannel.
reqwest = { version = "0.12", features = [
  "blocking",
  "json",
  "rustls-tls",
], default-features = false }

# In-app audio for the logo easter-egg jingle. default-features off so we
# only pull cpal playback + the mp3 decoder, not every symphonia codec.
rodio = { version = "0.22", default-features = false, features = [
  "playback",
  "symphonia-mp3",
] }

[target.'cfg(unix)'.dependencies]
x11rb = { version = "0.13", features = ["all-extensions"] }
daemonize = "0.5"
nix = { version = "0.29", features = ["fs", "poll", "process", "signal"] }
evdev = "0.12"
# Narrow Wayland-client dep for xdg-activation tokens only. The protocol
# is how a client hands the Wayland compositor authority to focus another
# surface — needed to make `nicotine cycle` actually deliver subsequent
# clicks to the newly-active EVE client on KWin Wayland, where X11
# _NET_ACTIVE_WINDOW alone doesn't propagate to Wayland surface focus.
# Pure-Rust impl via wayland-backend.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Wayland-native preview backend (Hyprland): layer-shell overlay surfaces,
# shm pools, seat/pointer and output tracking. Same version winit already
# pulls in, so no extra copy gets built. wlr protocols provide the
# foreign-toplevel "activated" state used for the active-client border.
smithay-client-toolkit = { version = "0.20", default-features = false }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# GPU buffer allocation for zero-copy preview capture (dmabuf): Hyprland
# copies EVE's frame GPU-to-GPU into these and we display them as-is,
# instead of a GPU->CPU readback into shm plus a re-upload. Links libgbm
# (mesa); default features off since we only allocate, never import.
gbm = { version = "0.18", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Console",
  "Win32_System_ProcessStatus",
] }
